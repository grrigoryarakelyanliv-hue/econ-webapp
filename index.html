<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econ Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }
        .hw-title { font-weight: bold; margin-bottom: 8px; }
        .deadline { color: #e74c3c; font-size: 12px; margin-bottom: 12px; }
        .leaflet-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .status { font-weight: bold; font-size: 13px; }
        .done { color: #27ae60; }
        .not-done { color: #e74c3c; }
        .btn {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #fff);
            font-size: 13px;
            flex: 1;
            text-align: center;
            cursor: pointer;
        }
        .tab.active { background: var(--tg-theme-button-color, #007aff); color: #fff; }
    </style>
</head>
<body>
    <h2>📊 Econ Platform</h2>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('homeworks')">📋 Домашки</div>
        <div class="tab" onclick="switchTab('rating')">⭐ Рейтинг</div>
    </div>
    <div id="content"><div class="card">Загрузка...</div></div>

    <script>
        // ===== НАСТРОЙКИ =====
        const API_BASE = "https://ВАШ_ДОМЕН.alwaysdata.net";  // ← замени на свой домен после создания
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const userId = tg.initDataUnsafe.user.id;  // Telegram ID пользователя

        // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
        async function apiGet(endpoint) {
            const res = await fetch(`${API_BASE}${endpoint}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        async function apiPost(endpoint, body) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        }

        // ===== ЗАГРУЗКА ДОМАШЕК =====
        async function loadHomeworks() {
            try {
                const data = await apiGet(`/api/student/${userId}/homeworks`);
                if (!data.length) {
                    document.getElementById('content').innerHTML = '<div class="card">Нет домашних заданий</div>';
                    return;
                }
                let html = '';
                const now = new Date();
                data.forEach(hw => {
                    const deadline = new Date(hw.deadline);
                    const deadlinePassed = now > deadline;
                    html += `<div class="card">
                        <div class="hw-title">📌 ${hw.title}</div>
                        <div class="deadline">⏰ Дедлайн: ${deadline.toLocaleDateString()} ${deadlinePassed ? '(прошёл)' : ''}</div>`;

                    hw.leaflets.forEach(lf => {
                        const statusText = lf.status === 'submitted' ? '✅ На проверке' :
                                           lf.status === 'returned' ? '↩ Возвращено' : '❌ Не сдано';
                        const statusClass = (lf.status === 'submitted') ? 'done' : 'not-done';
                        html += `<div class="leaflet-row">
                            <span>Листочек ${lf.number}</span>
                            <span class="status ${statusClass}">${statusText}</span>
                            ${!deadlinePassed && lf.status === 'not-submitted' ? 
                                `<button class="btn" onclick="submitLeaflet(${hw.id}, '${lf.number}')">📤 Сдать</button>` : ''}
                        </div>`;
                    });
                    html += `</div>`;
                });
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="card">Ошибка загрузки</div>';
                console.error(e);
            }
        }

        // ===== ЗАГРУЗКА РЕЙТИНГА =====
        async function loadRating() {
            try {
                const data = await apiGet(`/api/student/${userId}/rating`);
                let html = '<div class="card"><h3>⭐ Рейтинг</h3>';
                if (!data.length) html += '<p>Нет данных</p>';
                else {
                    data.forEach(r => {
                        html += `<div class="leaflet-row">
                            <span>Листочек ${r.leaflet}</span>
                            <span>${'➕'.repeat(r.points)}</span>
                        </div>`;
                    });
                }
                html += '</div>';
                document.getElementById('content').innerHTML = html;
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="card">Ошибка загрузки рейтинга</div>';
                console.error(e);
            }
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК =====
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'homeworks') loadHomeworks();
            else if (tab === 'rating') loadRating();
        }

        // ===== СДАТЬ ЛИСТОЧЕК =====
        async function submitLeaflet(hwId, leaflet) {
            try {
                await apiPost('/api/submit', {
                    user_id: userId,
                    homework_id: hwId,
                    leaflet: leaflet
                });
                // Обновляем отображение
                loadHomeworks();
            } catch (e) {
                alert('Ошибка отправки: ' + e.message);
            }
        }

        // ===== ПЕРВЫЙ ЗАПУСК =====
        loadHomeworks();
    </script>
</body>
</html>
