<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econ Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }
        .hw-title { font-weight: bold; margin-bottom: 8px; }
        .deadline { color: #e74c3c; font-size: 12px; margin-bottom: 12px; }
        .leaflet-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .status { font-weight: bold; font-size: 13px; }
        .done { color: #27ae60; }
        .not-done { color: #e74c3c; }
        .btn {
            background: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #fff);
            font-size: 13px;
            flex: 1;
            text-align: center;
            cursor: pointer;
        }
        .tab.active { background: var(--tg-theme-button-color, #007aff); color: #fff; }
    </style>
</head>
<body>
    <h2>📊 Econ Platform</h2>
    <div class="tabs">
        <div class="tab active" onclick="showTab('homeworks')">📋 Домашки</div>
        <div class="tab" onclick="showTab('rating')">⭐ Рейтинг</div>
    </div>
    <div id="content">
        <div class="card">
            <div class="hw-title">📌 Контрольная работа №1</div>
            <div class="deadline">⏰ Дедлайн: 01.06.2026</div>
            <div class="leaflet-row">
                <span>Листочек 1</span>
                <span class="status done">✅ Сдано</span>
            </div>
            <div class="leaflet-row">
                <span>Листочек 2</span>
                <span class="status not-done">❌ Не сдано</span>
            </div>
            <div class="leaflet-row">
                <span>Листочек 3</span>
                <button class="btn">📤 Сдать</button>
            </div>
        </div>
        <div class="card">
            <div class="hw-title">📌 Домашнее задание №2</div>
            <div class="deadline">⏰ Дедлайн: 20.05.2026 (прошёл)</div>
            <div class="leaflet-row">
                <span>Листочек 4</span>
                <span class="status done">✅ Сдано</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'rating') {
                document.getElementById('content').innerHTML = `
                    <div class="card">
                        <h3>⭐ Рейтинг</h3>
                        <div class="leaflet-row"><span>Листочек 1</span><span>➕➕</span></div>
                        <div class="leaflet-row"><span>Листочек 2</span><span>➕</span></div>
                        <div class="leaflet-row"><span>Листочек 3</span><span>➕➕➕</span></div>
                    </div>
                `;
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
